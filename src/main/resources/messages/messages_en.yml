file-version: 2
meta:
  name: "English"
  small-caps: true

general:
  no-permission: "<prefix> <error>! You do not have permission"
  player-only: "<prefix> <error>! This command is for players"
  player-not-found: "<prefix> <error>! Player not found"
  unknown-command: "<prefix> <error>! Unknown option"
  feature-disabled: "<prefix> <error>! This feature is disabled"
  gui-disabled: "<prefix> <error>! The menu is disabled"
  stale-gui: "<prefix> <warning>! This menu is outdated"
  reloaded: "<prefix> <success>✓ Configuration reloaded"
  reload-warnings: "<prefix> <warning>! Reloaded with %count% warning(s)"
  warning-line: "<prefix> <warning>• <muted>%text%"
  config-warnings-join: "<prefix> <warning>! %count% configuration warning(s) - check the logs"
  spam: "<prefix> <warning>! Slow down"

toggle:
  enabled: "<prefix> <success>✓ %setting% has been enabled"
  disabled: "<prefix> <error>× %setting% has been disabled"
  unknown: "<prefix> <error>! Unknown setting"
  usage: "<prefix> <info>→ <muted>/chat toggle ‹setting› [on|off]"
  list: "<prefix> <info>• <muted>%list%"

language:
  changed: "<prefix> <success>✓ Language set to %language%"
  usage: "<prefix> <info>→ <muted>/chat language [en|ar]"

reset:
  done: "<prefix> <success>✓ Settings have been reset"
  done-other: "<prefix> <success>✓ Settings of %target% have been reset"
  confirm-text: "<prefix> <warning>! Type /chat reset confirm to reset your settings"

help:
  header: "<prefix> <info>• Commands"
  setting: "<prefix> <sep>›</sep> <info>/chat setting</info> <muted>open your settings"
  toggle: "<prefix> <sep>›</sep> <info>/chat toggle ‹setting›</info> <muted>switch a setting"
  language: "<prefix> <sep>›</sep> <info>/chat language</info> <muted>switch language"
  reset: "<prefix> <sep>›</sep> <info>/chat reset</info> <muted>restore defaults"
  msg: "<prefix> <sep>›</sep> <info>/msg ‹player› ‹message›</info> <muted>private message"
  reload: "<prefix> <sep>›</sep> <info>/chat reload</info> <muted>reload configuration"
  ignore: "<prefix> <sep>›</sep> <info>/chat ignore ‹player›</info> <muted>hide a player's messages"

ignore:
  added: "<prefix> <success>✓ You no longer see %target%"
  removed: "<prefix> <success>✓ You see %target% again"
  list: "<prefix> <info>• Ignored: <muted>%list%"
  empty: "<prefix> <info>• You are not ignoring anyone"
  self: "<prefix> <error>! You cannot ignore yourself"
  exempt: "<prefix> <error>! This player cannot be ignored"
  usage: "<prefix> <info>→ <muted>/chat ignore ‹player›"
  disabled: "<prefix> <error>! Ignoring is disabled"
