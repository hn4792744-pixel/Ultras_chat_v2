  spam: "<prefix> <warning>! تمهّل قليلًا"

toggle:
  enabled: "<prefix> <success>✓ تم تفعيل %setting%"
  disabled: "<prefix> <error>× تم تعطيل %setting%"
  unknown: "<prefix> <error>! إعداد غير معروف"
  usage: "<prefix> <info>→ <muted>/chat toggle ‹الإعداد› [on|off]"
  list: "<prefix> <info>• <muted>%list%"

language:
  changed: "<prefix> <success>✓ تم تغيير اللغة إلى %language%"
  usage: "<prefix> <info>→ <muted>/chat language [en|ar]"

reset:
  done: "<prefix> <success>✓ تمت إعادة الإعدادات إلى الافتراضي"
  done-other: "<prefix> <success>✓ تمت إعادة إعدادات %target% إلى الافتراضي"
  confirm-text: "<prefix> <warning>! اكتب /chat reset confirm لإعادة الإعدادات"

help:
  header: "<prefix> <info>• الأوامر"
  setting: "<prefix> <sep>›</sep> <info>/chat setting</info> <muted>فتح الإعدادات"
  toggle: "<prefix> <sep>›</sep> <info>/chat toggle ‹الإعداد›</info> <muted>تبديل إعداد"
  language: "<prefix> <sep>›</sep> <info>/chat language</info> <muted>تغيير اللغة"
  reset: "<prefix> <sep>›</sep> <info>/chat reset</info> <muted>استعادة الافتراضي"
  msg: "<prefix> <sep>›</sep> <info>/msg ‹اللاعب› ‹الرسالة›</info> <muted>رسالة خاصة"
  reload: "<prefix> <sep>›</sep> <info>/chat reload</info> <muted>إعادة تحميل الإعدادات"
  ignore: "<prefix> <sep>›</sep> <info>/chat ignore ‹اللاعب›</info> <muted>إخفاء رسائل لاعب"

ignore:
  added: "<prefix> <success>✓ لن ترى رسائل %target% بعد الآن"
  removed: "<prefix> <success>✓ ستراقب رسائل %target% مجددًا"
  list: "<prefix> <info>• المتجاهَلون: <muted>%list%"
  empty: "<prefix> <info>• أنت لا تتجاهل أحدًا"
  self: "<prefix> <error>! لا يمكنك تجاهل نفسك"
  exempt: "<prefix> <error>! لا يمكن تجاهل هذا اللاعب"
  usage: "<prefix> <info>→ <muted>/chat ignore ‹اللاعب›"
  disabled: "<prefix> <error>! التجاهل معطل"
