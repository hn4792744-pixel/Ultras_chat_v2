file-version: 2
meta:
  name: "العربية"
  small-caps: false

general:
  no-permission: "<prefix> <error>! لا تملك الصلاحية"
  player-only: "<prefix> <error>! هذا الأمر للاعبين فقط"
  player-not-found: "<prefix> <error>! اللاعب غير موجود"
  unknown-command: "<prefix> <error>! خيار غير معروف"
  feature-disabled: "<prefix> <error>! هذه الميزة معطلة"
  gui-disabled: "<prefix> <error>! القائمة معطلة"
  stale-gui: "<prefix> <warning>! هذه القائمة قديمة"
  reloaded: "<prefix> <success>✓ تمت إعادة تحميل الإعدادات"
  reload-warnings: "<prefix> <warning>! تمت إعادة التحميل مع %count% تحذير"
  warning-line: "<prefix> <warning>• <muted>%text%"
